<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>강사 전용 모바일 출석부 & 알림톡</title>
  <link rel="stylesheet" href="attendance.css">
</head>
<body>
  <div class="att-container">
    <header class="att-header">
      <h1>📋 늘봄학교 모바일 강사 출석부</h1>
      <p style="font-size: 0.85rem; opacity: 0.9; margin-top: 4px;">출석 체크 시 학부모 안심 카카오 알림톡 자동 전송</p>
    </header>

    <main class="att-content">
      <div style="margin-bottom: 16px;">
        <label style="font-size: 0.85rem; font-weight: 700; color: #475569; display: block; margin-bottom: 6px;">강좌 선택</label>
        <select id="courseSelect" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-weight: 700;">
          <!-- Dynamic -->
        </select>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <span style="font-weight: 800; font-size: 0.95rem;">👨‍🎓 수강생 출결 상태</span>
        <span id="todayDateTag" style="font-size: 0.85rem; color: #4f46e5; font-weight: 700;"></span>
      </div>

      <div id="studentList">
        <!-- Dynamic Student Rows -->
      </div>

      <button id="saveAttendanceBtn" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">
        💾 출석 저장 & 카카오 알림톡 즉시 발송
      </button>
    </main>
  </div>

  <script src="attendance.js"></script>
</body>
</html>
