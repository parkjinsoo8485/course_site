<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width">
  <title>늘봄학교 - 광주풍향초등학교 비밀번호찾기</title>

  <!-- External Styles & Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/af/ad_lec/lists/sn/3267/dbdbschool_style.css">
</head>
<body>

  <div class="login-container">
    <!-- Header -->
    <header class="login-header">
      <h1>
        <span class="s_name">광주풍향초등학교</span>
        늘봄학교
      </h1>
      <div class="s_servie_box">
        <a href="javascript:void(0);" class="off btn_icon" id="btnServiceIcon" title="다른 서비스 둘러보기">
          <i class="fa-solid fa-grid-2-plus"></i>
          <span>서비스</span>
        </a>
        <div class="m_box" id="serviceMenuBox">
          <div class="arrow"></div>
          <h4>늘봄학교 / 방과후 서비스 목록</h4>
          <ul>
            <li>
              <a href="/af/ad_lec/lists/sn/3267/">
                <i class="fa-solid fa-school-flag"></i>
                <span>늘봄학교</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Main Card Body -->
    <div class="login_box">

      <!-- Role Selection Tabs -->
      <ul class="choice_user">
        <li class="login_user_grp1">
          <a href="javascript:void(0);" onclick="setFindPwGroup(1)" id="tab_grp1">
            <i class="fa-solid fa-user-tie"></i> 교직원
          </a>
        </li>
        <li class="login_user_grp2">
          <a href="javascript:void(0);" onclick="setFindPwGroup(2)" class="on" id="tab_grp2">
            <i class="fa-solid fa-child"></i> 학생
          </a>
        </li>
        <li class="login_user_grp4">
          <a href="javascript:void(0);" onclick="setFindPwGroup(4)" id="tab_grp4">
            <i class="fa-solid fa-chalkboard-user"></i> 강사
          </a>
        </li>
      </ul>

      <!-- Form Container -->
      <form id="fm_findpw" onsubmit="handleFindPwSubmit(event);" autocomplete="off">
        <input type="hidden" id="login_user_grp" value="2">

        <!-- TAB 1: 교직원 -->
        <div class="user_off grp1_box" style="display: none;">
          <ul class="in_box">
            <li>
              <div class="input-with-icon">
                <i class="fa">아이디</i>
                <input type="text" id="find_id" placeholder="아이디를 입력하세요." class="form-control">
              </div>
            </li>
          </ul>
        </div>

        <!-- TAB 2: 학생 (Default) -->
        <div class="user_off grp2_box" style="display: block;">
          <ul class="in_box">
            <li>
              <div class="student-select-grid">
                <select id="find_grade" class="form-control">
                  <option value="">=학년=</option>
                  <option value="1">1학년</option>
                  <option value="2">2학년</option>
                  <option value="3">3학년</option>
                  <option value="4">4학년</option>
                  <option value="5">5학년</option>
                  <option value="6">6학년</option>
                </select>
                <select id="find_class" class="form-control">
                  <option value="">=반=</option>
                  <script>
                    for(let i=1; i<=12; i++) {
                      document.write(`<option value="${i}">${i}반</option>`);
                    }
                  </script>
                </select>
                <select id="find_bunho" class="form-control">
                  <option value="">=번호=</option>
                  <script>
                    for(let i=1; i<=30; i++) {
                      document.write(`<option value="${i}">${i}번</option>`);
                    }
                  </script>
                </select>
              </div>
            </li>
            <li>
              <div class="input-with-icon">
                <i class="fa">이름</i>
                <input type="text" id="find_stu_name" placeholder="이름을 입력하세요." class="form-control">
              </div>
            </li>
          </ul>
        </div>

        <!-- TAB 3: 강사 -->
        <div class="user_off grp4_box" style="display: none;">
          <ul class="in_box">
            <li>
              <div class="input-with-icon">
                <i class="fa">아이디</i>
                <input type="text" id="find_lecturer_id" placeholder="아이디를 입력하세요." class="form-control">
              </div>
            </li>
          </ul>
        </div>

        <!-- Phone Verification Box -->
        <div style="padding: 15px 5%; background: #f7f7f7; border-top: 1px solid #ddd;">
          <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 10px;">
            <select id="hp1" class="form-control" style="width: 85px;">
              <option value="010" selected>010</option>
              <option value="011">011</option>
              <option value="016">016</option>
              <option value="017">017</option>
              <option value="018">018</option>
              <option value="019">019</option>
            </select>
            -
            <input type="text" id="hp2" maxlength="4" class="form-control" style="width: 75px;" placeholder="1234">
            -
            <input type="text" id="hp3" maxlength="4" class="form-control" style="width: 75px;" placeholder="5678">
          </div>

          <div style="font-size: 12px; color: #666; line-height: 1.6;">
            ※ 사용자 정보에 등록된 휴대폰 번호를 입력하세요.<br>
            - 사용자 정보 확인 후 <strong>등록된 휴대폰 번호로 임시 비밀번호를 발급</strong>해 드립니다.<br>
            - <strong>등록된 휴대폰이 없는 경우, 학교 담당자에게 문의</strong> 바랍니다.<br>
            <div style="margin-top: 10px; display: flex; gap: 10px;">
              <a href="/af/ad_lec/lists/sn/3267/" style="color: #2563eb; font-weight: 600; text-decoration: underline;">← 로그인페이지 이동</a>
              <a href="/member/faq/sn/3267/" style="color: #2563eb; font-weight: 600; text-decoration: underline;">❓ FAQ 보기</a>
            </div>
          </div>
        </div>

        <div class="login_btn">
          <p>
            <input type="submit" id="btn_submit" value="비밀번호 찾기" class="go_btn login_user_grp2">
          </p>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <footer id="footer">
      Copyright ⓒ <a href="http://www.xmecca.com" target="_blank">xmecca.com</a> All Rights Reserved.
    </footer>
  </div>

  <script>
    function setFindPwGroup(grp) {
      document.getElementById('login_user_grp').value = grp;
      document.querySelectorAll('.choice_user li a').forEach(a => a.classList.remove('on'));
      document.getElementById(`tab_grp${grp}`).classList.add('on');

      document.querySelector('.grp1_box').style.display = 'none';
      document.querySelector('.grp2_box').style.display = 'none';
      document.querySelector('.grp4_box').style.display = 'none';

      const submitBtn = document.getElementById('btn_submit');
      submitBtn.className = 'go_btn';

      if (grp === 1) {
        document.querySelector('.grp1_box').style.display = 'block';
        submitBtn.classList.add('login_user_grp1');
      } else if (grp === 2) {
        document.querySelector('.grp2_box').style.display = 'block';
        submitBtn.classList.add('login_user_grp2');
      } else if (grp === 4) {
        document.querySelector('.grp4_box').style.display = 'block';
        submitBtn.classList.add('login_user_grp4');
      }
    }

    function handleFindPwSubmit(e) {
      e.preventDefault();
      const hp1 = document.getElementById('hp1').value;
      const hp2 = document.getElementById('hp2').value.trim();
      const hp3 = document.getElementById('hp3').value.trim();

      if (!hp2 || !hp3) {
        alert('휴대폰 번호를 정확히 입력해 주세요.');
        return false;
      }

      alert(`[임시 비밀번호 발급]\n\n등록된 휴대폰(${hp1}-${hp2}-${hp3})으로 임시 비밀번호가 발송되었습니다.\n로그인 후 비밀번호를 변경해 주세요.`);
      window.location.href = '/af/ad_lec/lists/sn/3267/';
      return false;
    }
  </script>
</body>
</html>
