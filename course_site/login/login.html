<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 방과후 늘봄학교</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 440px;
      padding: 44px 36px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      color: var(--primary);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .role-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-sm);
      margin-bottom: 28px;
      gap: 4px;
    }
    .role-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      font-weight: 700;
    }
    .password-wrapper {
      position: relative;
    }
    .toggle-pw-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
    }
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      margin-bottom: 16px;
      display: none;
    }
    .links-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-box animate-fade-in">
    <div class="brand-title">
      <span>🏫</span> 늘봄학교 로그인
    </div>

    <div class="role-tabs" id="roleTabs">
      <button type="button" class="role-tab active" data-role="teacher">교사</button>
      <button type="button" class="role-tab" data-role="school_admin">학교관리자</button>
      <button type="button" class="role-tab" data-role="parent">학부모</button>
      <button type="button" class="role-tab" data-role="student">학생</button>
    </div>

    <div class="error-msg" id="errorBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" class="input-style" placeholder="아이디를 입력하세요 (데모: teacher)" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="input-style" placeholder="비밀번호를 입력하세요 (데모: 12341234)" required autocomplete="current-password">
          <button type="button" class="toggle-pw-btn" id="togglePwBtn" title="비밀번호 표시/숨기기">👁️</button>
        </div>
      </div>

      <div class="options-row">
        <label><input type="checkbox" id="saveId"> 아이디 저장</label>
        <label><input type="checkbox" id="keepLogin"> 로그인 상태 유지</label>
      </div>

      <button type="submit" class="btn-primary">로그인</button>
    </form>

    <div class="links-footer">
      <a href="../signup/teacher_signup.html">교사 가입</a>
      <span>|</span>
      <a href="../signup/school_register.html" style="font-weight: 700; color: var(--primary);">학교 유료 가입</a>
      <span>|</span>
      <a href="../index.html">홈으로</a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
