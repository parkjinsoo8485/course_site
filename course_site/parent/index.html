<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>늘봄학교 학부모 모바일 수강신청 포털</title>
  <link rel="stylesheet" href="parent_style.css">
</head>
<body>
  <div class="mobile-container">
    <!-- Header -->
    <header class="mobile-header">
      <span class="school-tag" id="parentSchoolTag">🏫 운천초등학교</span>
      <h1>늘봄/방과후학교 모바일 수강신청</h1>
      <p>10초 만에 원클릭 수강 신청 및 실시간 대기 조회</p>
    </header>

    <!-- Nav Tabs -->
    <nav class="nav-tabs-mobile" style="overflow-x: auto;">
      <button class="tab-btn-mobile active" data-tab="apply">📝 수강신청</button>
      <button class="tab-btn-mobile" data-tab="my">📱 내 신청/대기</button>
      <button class="tab-btn-mobile" data-tab="safety">🚌 귀가일정표</button>
      <button class="tab-btn-mobile" data-tab="absence">🤒 결석신청</button>
      <button class="tab-btn-mobile" data-tab="qa">💬 클래스Q&A</button>
    </nav>

    <!-- Content -->
    <main class="mobile-content">
      <!-- Toast Alert -->
      <div id="toastAlert" class="alert-toast"></div>

      <!-- Parent Auth Card -->
      <section class="auth-card">
        <h3>📱 학부모 1초 본인인증 & 자녀 정보</h3>
        <div class="form-group-mobile">
          <label>보호자 연락처 *</label>
          <input type="tel" id="parentPhone" class="input-mobile" placeholder="010-1234-5678" value="010-2345-6789">
        </div>
        <div class="form-group-mobile">
          <label>학생(자녀) 이름 *</label>
          <input type="text" id="parentStudentName" class="input-mobile" placeholder="예: 김민준" value="김민준">
        </div>
        <div class="form-group-mobile">
          <label>학년 / 반</label>
          <input type="text" id="parentGradeClass" class="input-mobile" placeholder="예: 1학년 2반" value="1학년 2반">
        </div>
        <div class="form-group-mobile">
          <label>수강료 지원 구분</label>
          <select id="parentSubsidyType" class="input-mobile">
            <option value="자유수강권">자유수강권 (연 60만원 한도)</option>
            <option value="늘봄 지원금">늘봄전담 지원금 (무상)</option>
            <option value="일반 자부담">일반 자부담</option>
          </select>
        </div>
        <button id="lookupMyAppsBtn" class="btn-mobile-primary" style="margin-top: 6px; background: #6366f1;">
          🔍 내 자녀 신청/대기 현황 조회
        </button>
      </section>

      <!-- TAB 1: APPLY LIST -->
      <div id="tab-apply-view" class="tab-view-pane">
        <h3 style="font-size: 1rem; margin-bottom: 12px;">📚 개설 강좌 목록 (실시간 좌석)</h3>
        <div id="parentCourseList">
          <!-- Dynamic Course Cards -->
        </div>
      </div>

      <!-- TAB 2: MY APPLICATIONS -->
      <div id="tab-my-view" class="tab-view-pane" style="display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 12px;">✅ 수강 신청 승인 내역</h3>
        <div id="myApplicantList" style="margin-bottom: 20px;">
          <!-- Dynamic -->
        </div>

        <h3 style="font-size: 1rem; margin-bottom: 12px;">⌛ 대기자 명단 내역</h3>
        <div id="myWaitlistList">
          <!-- Dynamic -->
        </div>
      </div>

      <!-- TAB 3: SAFETY RETURN SCHEDULE -->
      <div id="tab-safety-view" class="tab-view-pane" style="display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 12px;">🚌 자녀 하교/귀가 일정 등록</h3>
        <div class="auth-card">
          <div class="form-group-mobile">
            <label>귀가 요일 *</label>
            <input type="text" id="retDay" class="input-mobile" value="월,수,금" placeholder="예: 월,수,금">
          </div>
          <div class="form-group-mobile">
            <label>귀가 예정 시간 *</label>
            <input type="text" id="retTime" class="input-mobile" value="16:30" placeholder="예: 16:30">
          </div>
          <div class="form-group-mobile">
            <label>동행/픽업 구체방법 *</label>
            <input type="text" id="retPickup" class="input-mobile" value="어머니 직접 동행 귀가" placeholder="예: 어머니 자차, 학원차량">
          </div>
          <button id="saveReturnScheduleBtn" class="btn-mobile-primary" style="margin-top: 6px;">
            💾 귀가 일정표 등록하기
          </button>
        </div>
        <div id="safetyScheduleList"></div>
      </div>

      <!-- TAB 4: ABSENCE REQUEST -->
      <div id="tab-absence-view" class="tab-view-pane" style="display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 12px;">🤒 결석 및 조퇴 신청서 제출</h3>
        <div class="auth-card">
          <div class="form-group-mobile">
            <label>해당 강좌 선택</label>
            <input type="text" id="absCourseTitle" class="input-mobile" value="[특기적성] 창의 로봇교실 A반">
          </div>
          <div class="form-group-mobile">
            <label>결석/조퇴 예정일자 *</label>
            <input type="date" id="absDate" class="input-mobile">
          </div>
          <div class="form-group-mobile">
            <label>신청 사유 *</label>
            <textarea id="absReason" class="input-mobile" rows="3" placeholder="병원 진료 또는 가정 사정 등 사유 입력"></textarea>
          </div>
          <button id="submitAbsenceBtn" class="btn-mobile-primary" style="margin-top: 6px; background: #ef4444;">
            📩 결석 신청서 전달하기
          </button>
        </div>
      </div>

      <!-- TAB 5: CLASS Q&A -->
      <div id="tab-qa-view" class="tab-view-pane" style="display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 12px;">💬 담당 강사 1:1 Q&A 문의</h3>
        <div class="auth-card">
          <div class="form-group-mobile">
            <label>문의 제목 *</label>
            <input type="text" id="qaTitle" class="input-mobile" placeholder="제목을 입력해 주세요.">
          </div>
          <div class="form-group-mobile">
            <label>문의 내용 *</label>
            <textarea id="qaContent" class="input-mobile" rows="3" placeholder="강사님께 전달할 질문 입력"></textarea>
          </div>
          <button id="submitQABtn" class="btn-mobile-primary" style="margin-top: 6px; background: #4f46e5;">
            💬 질문 작성하기
          </button>
        </div>
        <div id="parentQAList"></div>
      </div>
    </main>
  </div>

  <script src="parent_app.js"></script>
</body>
</html>
