	function apply(num, mem_name, mem_grade, mem_course, mem_class_, mem_bunho) {
		var tw = '';
		var tn = 'af_ad_sin';
		var ti = '';
		
		var mem_info = mem_grade + '학년';
		if(mem_course) {
			mem_info += ' ' + mem_course;
		}
		mem_info += ' ' + mem_class_ + '반';
		mem_info += ' ' + mem_bunho + '번';
		mem_info += ' ' + mem_name;
		
		if (tw == 'parent') { // 모달
			tw_ = parent.document;		
		} else { // 새창
			tw_ = opener.document; 
		}		
		
		if(tn == 'af_free_stu' || tn == 'milk_free_stu') {
			$('#fm_edit #mem_num',tw_).val(num);
			$('#fm_edit #mem_info',tw_).text(mem_info);			
		} else if(tn == 'fr_ad_sin' || tn == 'af_ad_sin' || tn == 'af_ans_mem') {
			$('#fm_sin_search #mem_num',tw_).val(num);
			$('#fm_sin_search #mem_info',tw_).val(mem_info);
		} else {			
			$('#fm_edit #mem_num',tw_).val(num);
			$('#fm_edit #mem_info',tw_).val(mem_info);
		}
		
		if( isMobile.any() && tw != 'parent') {
			alert('적용되었습니다.\n창이 닫히지 않는 경우 부모창으로 전환 후 이용하세요.');
		}
		
		if(tn == 'fr_ad_sin' || tn == 'af_ad_sin' || tn == 'af_ans_mem') {
			$('#fm_sin_search', tw_).get(0).submit();
		}
		
		if (tw == 'parent') { 
			// 모달 닫기				
			parent.close_modal('hide');
		} else { 
			// 새창 닫기
			self.close();
		}
	}

<script type="text/javascript">
	$(window).load(function(){
		// { 모달경고창
		$('#myModal').on('hidden.bs.modal', function () {
			close_modal();
		});

		show_modal();
		msg_input_on();
		// }

		/*솔루션 이동 아이콘*/
		$('.s_servie_box a.btn_icon').click(function(){
			$(this).not('.m_box ul li a').toggleClass('off on')
			$(this).next('.m_box').toggle(0)
		});
	});

	function show_modal(msg, emsg) {
		var $obj = $('#myModal');
		if(msg) {
			$obj.find('div.modal-body div.message').html(msg);
		}
		if(emsg) {
			$obj.find('div.modal-body div.error_msg').html(emsg);
		}

		if(msg || emsg || $obj.find('div.modal-body div.message').html() 
			|| $obj.find('div.modal-body div.error_msg').html())
		{
			$obj.modal();
		}
	}

	function close_modal() {
		var $obj = $('#myModal');
		$obj.find('div.modal-body div.message').html('');
		$obj.find('div.modal-body div.error_msg').html('');
	}


	function msg_input_on(){
		$('form div.error_msg').each(function(e){
			var msg_u = $(this);		
			
			var class_list = $(this).attr('class');
			var target_input = '';
			class_list = class_list.split(' ');
			if(class_list.length > 1) {
				for(ii = 1; ii < class_list.length; ii++) {
					var target_input = class_list[ii];
					if(target_input.search('error_') == 0) {
						target_input = target_input.replace('error_', '');
						break;
					}
				}
			}

			if($(msg_u).children('p').size() > 0){
				if(!target_input) { $(msg_u).parent().children('.form-control').addClass('error_msg_on'); }
				else {
					$('#' + target_input).addClass('error_msg_on'); 
				}
			} else {
				if(!target_input) { $(msg_u).parent().children('.form-control').removeClass('error_msg_on'); }
				else {
					$('#' + target_input).removeClass('error_msg_on'); 
				}
			}
		});
	}

</script>
