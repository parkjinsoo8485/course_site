<div id="modal_sub_app_register" class="modal" style="display: flex; top: 0px; left: 0px; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center; position: fixed !important; z-index: 99999 !important;">
    <div class="modal-box" style="margin:auto !important; position:relative !important; background:#ffffff; border-radius:6px; width:90%; max-width:650px; max-height:90vh; overflow-y:auto; box-shadow:0 10px 25px rgba(0,0,0,0.25); border:1px solid #cbd5e1;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid #e2e8f0; background:#f8fafc; border-radius:6px 6px 0 0;">
        <h4 style="margin:0; font-size:15px; font-weight:bold; color:#1e293b;">수강자 등록</h4>
        <button type="button" onclick="closeSubsidyAppRegisterModal();" style="border:none; background:transparent; font-size:20px; cursor:pointer; color:#64748b; line-height:1;">×</button>
      </div>
      <div style="padding:16px 20px;">
        <div style="font-size:12px; color:#2563eb; margin-bottom:12px; display:flex; align-items:center; gap:4px;">
          <i class="fa fa-check-square-o"></i> 표시가 있는 항목은 반드시 입력해야 합니다.
        </div>
        <form id="fm_sub_app_register" onsubmit="event.preventDefault(); submitSubsidyAppRegister();">
          <input type="hidden" id="sub_app_reg_applicant_id" value="" style="">
          <table class="db-table" style="width:100%; border-collapse:collapse; margin-bottom:16px;">
            <tbody>
              <tr>
                <th style="width:140px; background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">대상 월 <span style="color:#2563eb;">☑</span></th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <select id="sub_app_reg_month" style="height:30px; line-height:normal !important; box-sizing:border-box !important; vertical-align:middle; padding:0 24px 0 10px; border:1px solid #ccc; border-radius:3px; font-size:12px;">
                    <option value="3월" selected="">3월</option>
                    <option value="4월">4월</option>
                    <option value="5월">5월</option>
                    <option value="6월">6월</option>
                    <option value="7월">7월</option>
                    <option value="8월">8월</option>
                    <option value="9월">9월</option>
                    <option value="10월">10월</option>
                    <option value="11월">11월</option>
                    <option value="12월">12월</option>
                    <option value="1월">1월</option>
                    <option value="2월">2월</option>
                  </select>
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">월 최대 지원 금액 <span style="color:#2563eb;">☑</span></th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <div style="display:inline-flex; align-items:center; gap:6px;">
                    <input type="number" id="sub_app_reg_max_amount" value="0" style="width: 110px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(250, 204, 21); background: rgb(254, 240, 138); font-weight: bold; border-radius: 3px; font-size: 13px;">
                    <span style="font-size:12px;">원 (강좌 합산)</span>
                  </div>
                  <div style="font-size:11px; color:#666; margin-top:3px;">('0'원인 경우 제한 없이 지원됩니다.)</div>
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">이름 <span style="color:#2563eb;">☑</span></th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span id="sub_app_reg_student_name_label" style="font-weight:bold; font-size:13px; color:#1e293b;">미선택</span>
                    <button type="button" class="btn btn-success btn-sm" onclick="openSubsidyAppSearchStudentModal();" style="height:30px; padding:0 12px; display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:bold; border-radius:3px; background-color:#5cb85c; border-color:#4cae4c; color:#fff; cursor:pointer;">
                      <i class="fa fa-binoculars"></i> 신청자 검색
                    </button>
                  </div>
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">학년 / 반 / 번호</th>
                <td style="border:1px solid #ddd; padding:8px 12px; font-size:12px;">
                  <span id="sub_app_reg_grade_label">-</span>학년 <span id="sub_app_reg_class_label">-</span>반 <span id="sub_app_reg_num_label">-</span>번
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">강좌명</th>
                <td style="border:1px solid #ddd; padding:8px 12px; font-size:12px; font-weight:bold; color:#1e293b;" id="sub_app_reg_course_label">-</td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">수강료</th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <input type="number" id="sub_app_reg_tuition_fee" value="0" style="width: 130px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(204, 204, 204); border-radius: 3px; font-size: 12px;"> 원 (강사료 + 수용비)
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">강사료</th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <input type="number" id="sub_app_reg_instructor_fee" value="0" style="width: 130px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(204, 204, 204); border-radius: 3px; font-size: 12px;"> 원
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">수용비</th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <input type="number" id="sub_app_reg_overhead_fee" value="0" style="width: 130px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(204, 204, 204); border-radius: 3px; font-size: 12px;"> 원
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">교재비</th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <input type="number" id="sub_app_reg_textbook_fee" value="0" style="width: 130px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(204, 204, 204); border-radius: 3px; font-size: 12px;"> 원
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">재료비</th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <input type="number" id="sub_app_reg_material_fee" value="0" style="width: 130px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(204, 204, 204); border-radius: 3px; font-size: 12px;"> 원
                </td>
              </tr>
              <tr>
                <th style="background:#f8fafc; border:1px solid #ddd; padding:8px 12px; text-align:left; font-weight:bold; font-size:12px;">지원금액</th>
                <td style="border:1px solid #ddd; padding:8px 12px;">
                  <input type="number" id="sub_app_reg_subsidized_amount" value="0" style="width: 130px; height: 30px; text-align: right; padding: 0px 8px; border: 1px solid rgb(147, 197, 253); background: rgb(239, 246, 255); font-weight: bold; color: rgb(29, 78, 216); border-radius: 3px; font-size: 12px;"> 원
                </td>
              </tr>
            </tbody>
          </table>
          <div style="display:flex; justify-content:center; gap:10px;">
            <button type="button" class="btn btn-default btn-sm" onclick="closeSubsidyAppRegisterModal();" style="height:30px; padding:0 18px; font-size:12px; border:1px solid #ccc; background:#fff; color:#333; border-radius:3px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;">취소</button>
            <button type="button" class="btn btn-primary btn-sm" onclick="submitSubsidyAppRegister();" style="height:30px; padding:0 22px; font-size:12px; font-weight:bold; background-color:#337ab7; border-color:#2e6da4; color:#fff; border-radius:3px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;">등록</button>
          </div>
        </form>
      </div>
    </div>
  </div>
