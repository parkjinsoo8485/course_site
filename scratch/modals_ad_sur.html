                <i class="fa fa-check-square-o" style="margin-right: 4px;"></i> 참여현황 엑셀출력
              </button>
            </div>
          </div>

          <!-- 2행: 강좌/강사 멀티체크 & 학년/반 필터 -->
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <!-- 강좌/강사 멀티 필터 -->
            <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px 12px; background: #fdfdfd;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label style="margin: 0; font-size: 12px; font-weight: bold; color: #333;">
                  강좌/강사 필터
                </label>
                <label style="margin: 0; font-size: 11px; cursor: pointer; color: #337ab7;">
                  <input type="checkbox" id="ans_check_all_lec" onclick="toggleAnsLecList(this);" checked> 전체선택
                </label>
              </div>
              <div id="ans_lec_checkbox_list" style="max-height: 90px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px;">
                <label class="checkbox-inline" style="margin: 0;"><input type="checkbox" name="s_lec_list[]" value="박지숙" checked> 박지숙(논술)</label>
                <label class="checkbox-inline" style="margin: 0;"><input type="checkbox" name="s_lec_list[]" value="강태연" checked> 강태연(놀이체육)</label>
                <label class="checkbox-inline" style="margin: 0;"><input type="checkbox" name="s_lec_list[]" value="박지연" checked> 박지연(뉴스포츠)</label>
                <label class="checkbox-inline" style="margin: 0;"><input type="checkbox" name="s_lec_list[]" value="김지향" checked> 김지향(댄스)</label>
                <label class="checkbox-inline" style="margin: 0;"><input type="checkbox" name="s_lec_list[]" value="최정호" checked> 최정호(로봇과학)</label>
                <label class="checkbox-inline" style="margin: 0;"><input type="checkbox" name="s_lec_list[]" value="김윤정" checked> 김윤정(컴퓨터)</label>
              </div>
            </div>

            <!-- 학년/반 필터 -->
            <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px 12px; background: #fdfdfd; display: flex; flex-direction: column; justify-content: space-between;">
              <label style="margin: 0 0 6px 0; font-size: 12px; font-weight: bold; color: #333;">학년/반 필터</label>
              <div style="display: flex; align-items: center; gap: 6px;">
                <select id="ans_sgr" class="form-control input-sm" style="height: 30px; line-height: normal !important; flex: 1;">
                  <option value="">전체학년</option>
                  <option value="1">1학년</option>
                  <option value="2">2학년</option>
                  <option value="3">3학년</option>
                  <option value="4">4학년</option>
                  <option value="5">5학년</option>
                  <option value="6">6학년</option>
                </select>
                <select id="ans_scl" class="form-control input-sm" style="height: 30px; line-height: normal !important; flex: 1;">
                  <option value="">전체반</option>
                  <option value="1">1반</option>
                  <option value="2">2반</option>
                  <option value="3">3반</option>
                </select>
                <button type="button" onclick="filterSurveyAnswers();" class="btn btn-default" style="display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 10px; font-size: 12px; line-height: 1;">
                  조회
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 설문 결과 요약 메타 카드 -->
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px;">
          <div style="background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; text-align: center;">
            <div style="font-size: 11px; color: #777;">총 대상자</div>
            <div id="stat_total_target" style="font-size: 20px; font-weight: bold; color: #333; margin-top: 2px;">154명</div>
          </div>
          <div style="background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; text-align: center;">
            <div style="font-size: 11px; color: #777;">응답 완료자</div>
            <div id="stat_total_answered" style="font-size: 20px; font-weight: bold; color: #2e6da4; margin-top: 2px;">129명</div>
          </div>
          <div style="background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; text-align: center;">
            <div style="font-size: 11px; color: #777;">응답률</div>
            <div id="stat_answer_rate" style="font-size: 20px; font-weight: bold; color: #3c763d; margin-top: 2px;">83.8%</div>
          </div>
          <div style="background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 10px 14px; text-align: center;">
            <div style="font-size: 11px; color: #777;">전체 종합 만족도</div>
            <div id="stat_overall_satisfaction" style="font-size: 20px; font-weight: bold; color: #d9534f; margin-top: 2px;">94.6점</div>
          </div>
        </div>

        <!-- 각 문항별 통계 그래프 및 집계표 리스트 -->
        <div id="ans_questions_stats_container" style="display: flex; flex-direction: column; gap: 14px;">
          <!-- Dynamically populated via sur_logic.js -->
        </div>
      </div>
      <div class="modal-footer" style="padding: 10px 20px; background: #f5f5f5; border-top: 1px solid #ddd; text-align: right;">
        <button type="button" class="btn btn-default" data-dismiss="modal" style="display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 16px; font-size: 12px; line-height: 1;">
          닫기
        </button>
      </div>
    </div>
  </div>
</div>
